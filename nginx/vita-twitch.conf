# PS-Vita-Twitch: ttv.serverlele.de (laeuft im NPM-Container als /data/nginx/custom/http.conf)
# RSA-Zertifikat + Cipher, die die alte TLS-Implementierung der Vita versteht (TLS_RSA_WITH_AES_*_CBC_SHA*).
log_format vita_timing '[$time_iso8601] $status $request_method $scheme://$host$request_uri [Client $remote_addr] rt=${request_time}s up=${upstream_response_time}s $ssl_protocol/$ssl_cipher "$http_user_agent"';

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  # usher-Namen nur noetig, wenn ein Geraet per DNS statt tls_fixer umgeleitet wird (z. B. PS3)
  server_name ttv.serverlele.de usher.twitch.tv usher.ttvnw.net usher.justin.tv;

  ssl_certificate     /etc/letsencrypt/live/ttv-rsa/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ttv-rsa/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA';
  ssl_prefer_server_ciphers on;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/letsencrypt-acme-challenge.conf;

  access_log /data/logs/vita-twitch_access.log proxy;
  access_log /data/logs/vita-twitch_timing.log vita_timing;
  error_log  /data/logs/vita-twitch_error.log info;

  location / {
    set $forward_scheme https;
    set $server         "127.0.0.1";
    set $port           8443;
    include conf.d/include/proxy.conf;
  }
}
