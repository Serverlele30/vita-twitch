# MediaMTX fuer die Nokia-N8-Twitch-App
# Holt Twitch-Streams und VODs ueber den vita-twitch-Adapter (HLS) und stellt sie per RTSP bereit.
# Ziel: /opt/mediamtx/mediamtx.yml

logLevel: info
logDestinations: [stdout]

# Grosszuegige Zeitlimits und Puffer: kurze WLAN-/Mobilfunk-Aussetzer trennen die Verbindung nicht
readTimeout: 30s
writeTimeout: 30s
writeQueueSize: 4096

rtsp: yes
rtspAddress: :8554
# Nur TCP: kommt durch jedes NAT (UDP blieb ohne Laptop schwarz)
rtspTransports: [tcp]
rtpAddress: :8002
rtcpAddress: :8003

rtmp: no
hls: no
webrtc: no
srt: no
moq: no
api: no
metrics: no
pprof: no
playback: no

# Lesen fuer alle, veroeffentlichen nur von localhost (ffmpeg)
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
        path:
  - user: any
    pass:
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: publish
        path:

paths:
  # Live: rtsp://<host>:8554/tw/<kanal>
  "~^tw/([a-z0-9_]{1,25})$":
    runOnDemand: /opt/mediamtx/n8-transcode.sh live $G1
    runOnDemandRestart: yes
    runOnDemandStartTimeout: 25s
    # laenger offen halten: kurzer Abbruch + Neuverbinden der App findet den Stream noch laufend vor
    runOnDemandCloseAfter: 30s
  # VOD: rtsp://<host>:8554/vod/<video-id>  (spielt von vorne, ohne Spulen)
  "~^vod/([0-9]{1,15})$":
    runOnDemand: /opt/mediamtx/n8-transcode.sh vod $G1
    runOnDemandRestart: no
    runOnDemandStartTimeout: 30s
    runOnDemandCloseAfter: 10s
